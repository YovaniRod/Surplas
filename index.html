<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #0a0a0a; color: #eee; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 65px; background: #111; display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-right: 1px solid #333; }
        .nav-item { margin-bottom: 25px; cursor: pointer; opacity: 0.5; font-size: 10px; text-transform: uppercase; transition: 0.2s; }
        .nav-item:hover { opacity: 1; color: #00d2ff; }

        .main { flex-grow: 1; display: flex; flex-direction: column; }
        .header { padding: 12px; background: #111; display: flex; justify-content: center; border-bottom: 1px solid #333; }
        .search-box { width: 60%; display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #1a1a1a; color: white; outline: none; }
        button { padding: 10px 20px; background: #00d2ff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: #000; }

        iframe { flex-grow: 1; width: 100%; border: none; background: #000; }

        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .boot-box { text-align: center; border: 1px solid #333; padding: 50px; border-radius: 4px; }
        #timer { font-size: 32px; color: #00d2ff; margin: 20px 0; font-family: monospace; }
        #entry-btn { padding: 12px 30px; background: #222; color: #555; border: none; border-radius: 4px; cursor: not-allowed; font-weight: bold; }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="boot-box">
            <p style="letter-spacing: 2px;">SECURE BOOT ACTIVE</p>
            <p style="font-size: 12px; color: #666; margin-top: 5px;">PANIC BIND: [ ` ]</p>
            <div id="timer">3</div>
            <button id="entry-btn" disabled onclick="document.getElementById('boot-screen').remove()">LOCKED</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="nav-item" onclick="location.reload()">HOME</div>
        <div class="nav-item" onclick="panic()">EXIT</div>
    </div>

    <div class="main">
        <div class="header">
            <div class="search-box">
                <input type="text" id="urlInput" placeholder="Enter URL or Search Query..." onkeydown="if(event.key==='Enter') execute()">
                <button onclick="execute()">EXECUTE</button>
            </div>
        </div>
        <iframe id="viewport" src="about:blank"></iframe>
    </div>

    <script>
        const proxyBase = "https://solid-guacamole-r44qqrjxj55j2p6pw-8080.app.github.dev/uv/service/";

        function execute() {
            let val = document.getElementById('urlInput').value;
            if (!val) return;

            if (!val.includes('.') || val.includes(' ')) {
                val = "https://www.google.com/search?q=" + encodeURIComponent(val);
            } else if (!val.startsWith('http')) {
                val = "https://" + val;
            }

            document.getElementById('viewport').src = proxyBase + btoa(val);
        }

        function panic() { window.location.href = "https://classroom.google.com"; }
        
        document.addEventListener('keydown', e => { 
            if (e.key === '`') panic(); 
        });

        let timeLeft = 3;
        const countdown = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById('timer').style.display = 'none';
                const btn = document.getElementById('entry-btn');
                btn.innerText = "ACCESS SYSTEM";
                btn.disabled = false;
                btn.style.background = "#00d2ff";
                btn.style.color = "#000";
                btn.style.cursor = "pointer";
            }
        }, 1000);
    </script>
</body>
</html>
